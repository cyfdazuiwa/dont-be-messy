<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>焦虑拉扯 · Anxiety Tug</title>
<style>
  :root {
    --bg: #17181c;
    --panel: #22242a;
    --text: #d8dae0;
    --dim: #8a8d96;
    --accent: #f7a41d;
    --danger: #e0483e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100%;
  }
  header { width: 100%; max-width: 1060px; padding: 18px 24px 10px; }
  header h1 { font-size: 18px; font-weight: 600; }
  header h1 .en { color: var(--dim); font-weight: 400; font-size: 14px; margin-left: 8px; }
  header .meta { color: var(--dim); font-size: 12.5px; margin-top: 2px; }
  .stage {
    position: relative;
    width: min(1060px, calc(100vw - 32px));
    height: min(640px, calc(100vh - 190px));
    min-height: 420px;
    background: #faf9f5;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,.55);
    flex: 0 0 auto;
  }
  canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  canvas.grabbing { cursor: grabbing; }
  .hud-stats {
    position: absolute; top: 12px; left: 14px;
    background: rgba(23,24,28,.82);
    color: #e8e9ec;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px; line-height: 1.7;
    pointer-events: none;
    font-variant-numeric: tabular-nums;
    backdrop-filter: blur(3px);
  }
  .hud-stats b { font-weight: 600; margin-left: 6px; }
  #stMood.calm { color: #7fd18b; }
  #stMood.anxious { color: #ff8d80; }
  .intro {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(23,24,28,.45);
    transition: opacity .5s ease;
  }
  .intro.hidden { opacity: 0; pointer-events: none; }
  .intro .card {
    background: rgba(34,36,42,.96);
    border: 1px solid #3a3d46;
    border-radius: 12px;
    padding: 22px 28px;
    max-width: 480px;
    text-align: center;
    color: #e8e9ec;
    font-size: 13.5px;
  }
  .intro .card p { margin: 6px 0; }
  .intro .card .l2 { color: var(--dim); font-size: 12px; }
  .intro .card b { color: #fff; }
  .intro button {
    margin-top: 14px;
    background: var(--accent);
    color: #1c1c1e;
    border: none;
    border-radius: 8px;
    padding: 8px 30px;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  .intro button:hover { filter: brightness(1.08); }
  footer { color: var(--dim); font-size: 12px; padding: 10px 24px 20px; max-width: 1060px; }
  footer code { background: var(--panel); border-radius: 4px; padding: 1px 6px; font-size: 11px; }
</style>
</head>
<body>
  <header>
    <h1>焦虑拉扯<span class="en">Anxiety Tug</span></h1>
    <div class="meta">一个关于"把注意力拉回中心"的小游戏 · 按住拖拽红点，抵抗四方波形的拉力</div>
  </header>

  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="hud-stats">
      <div>状态<b id="stMood" class="calm">平静</b></div>
      <div>连续平静<b id="stStreak">0.0 s</b></div>
      <div>最佳纪录<b id="stBest">0.0 s</b></div>
      <div>平静率<b id="stRate">--</b></div>
    </div>
    <div class="intro" id="intro">
      <div class="card">
        <p><b>按住画布任意位置拖动</b>，红点会像被橡皮筋拴住一样跟着指针；</p>
        <p>四周的蓝色波形一直在把它往外拉 —— 请尽量让它留在<b>黑色安全圈</b>内。</p>
        <p class="l2">波形振幅越大，拉力越强 · 被拉出边界会进入焦虑警示状态 · 安全线弧 30 秒充满</p>
        <button id="btnStart">开 始</button>
      </div>
    </div>
  </div>

  <footer>
    交互：<code>按住拖拽</code> 控制红点 · <code>R</code> 重新开始 ·
    在圈内为平静（绿色），被拉出边界则进入焦虑状态（红色警示，螺旋加速抖动、波形变红）
  </footer>

<script>
"use strict";
(() => {
  const canvas = document.getElementById("c");
  const stage  = document.getElementById("stage");
  const ctx = canvas.getContext("2d");

  // ---------- 尺寸 ----------
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = stage.clientWidth; H = stage.clientHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  // ---------- 颜色（平静态 ↔ 焦虑态 插值） ----------
  function hex2rgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function mix(c1, c2, t) {
    return `rgb(${Math.round(c1[0]+(c2[0]-c1[0])*t)},${Math.round(c1[1]+(c2[1]-c1[1])*t)},${Math.round(c1[2]+(c2[2]-c1[2])*t)})`;
  }
  const C = {
    bg:     [hex2rgb("#faf9f5"), hex2rgb("#f7ece7")],
    circle: [hex2rgb("#1c1c1e"), hex2rgb("#d2372c")],
    wave:   [hex2rgb("#4353d9"), hex2rgb("#e0483e")],
    dash:   [hex2rgb("#9a9ea6"), hex2rgb("#d2372c")],
    spiral: [hex2rgb("#6a6d75"), hex2rgb("#8c4038")],
    dot:    [hex2rgb("#e0301e"), hex2rgb("#a81f14")],
  };

  // ---------- 游戏状态 ----------
  const game = {
    running: false,
    pos: { x: 0, y: 0 }, vel: { x: 0, y: 0 },
    pointer: { x: 0, y: 0, down: false, near: false },
    stress: 0,           // 0 平静 … 1 焦虑（平滑过渡）
    shake: 0, flash: 0,  // 出圈瞬间的震屏与红闪
    streak: 0, best: +(localStorage.getItem("anxiety_best") || 0),
    insideTime: 0, totalTime: 0,
    waves: [], spirals: [],
  };

  function safeR() { return clamp(Math.min(W, H) * 0.19, 105, 185); }
  function center() { return { x: W / 2, y: H / 2 }; }

  // 四个波形：上下左右各一个，锚点即拉力方向
  function initWaves() {
    game.waves = [
      { side: "top",    ph: rand(0, 6.28), freq: rand(0.018, 0.03), spd: rand(1.8, 3.0), surge: 0, next: rand(1.5, 3.5) },
      { side: "bottom", ph: rand(0, 6.28), freq: rand(0.018, 0.03), spd: rand(1.8, 3.0), surge: 0, next: rand(1.5, 3.5) },
      { side: "left",   ph: rand(0, 6.28), freq: rand(0.018, 0.03), spd: rand(1.8, 3.0), surge: 0, next: rand(1.5, 3.5) },
      { side: "right",  ph: rand(0, 6.28), freq: rand(0.018, 0.03), spd: rand(1.8, 3.0), surge: 0, next: rand(1.5, 3.5) },
    ];
  }
  // 环绕控制点的灰色螺旋
  function initSpirals() {
    game.spirals = [
      { r: 0.62, turns: 3.0, dir:  1, spd: 1.00, ph: rand(0, 6.28), rot: rand(0, 6.28) },
      { r: 0.46, turns: 2.2, dir: -1, spd: 1.45, ph: rand(0, 6.28), rot: rand(0, 6.28) },
      { r: 0.78, turns: 3.8, dir: -1, spd: 0.70, ph: rand(0, 6.28), rot: rand(0, 6.28) },
    ];
  }

  function anchorOf(w) {
    const m = 34;
    switch (w.side) {
      case "top":    return { x: W / 2, y: m };
      case "bottom": return { x: W / 2, y: H - m };
      case "left":   return { x: m, y: H / 2 };
      case "right":  return { x: W - m, y: H / 2 };
    }
  }

  function reset(full) {
    const c = center();
    game.pos.x = c.x; game.pos.y = c.y;
    game.vel.x = 0; game.vel.y = 0;
    game.stress = 0; game.shake = 0; game.flash = 0;
    game.streak = 0;
    if (full) { game.insideTime = 0; game.totalTime = 0; initWaves(); }
  }

  // ---------- 交互 ----------
  const intro = document.getElementById("intro");
  document.getElementById("btnStart").addEventListener("click", () => {
    intro.classList.add("hidden");
    game.running = true;
    reset(true);
  });
  window.addEventListener("keydown", (e) => {
    if (e.code === "KeyR") { reset(true); game.running = true; intro.classList.add("hidden"); }
  });

  function ptr(e) {
    const r = canvas.getBoundingClientRect();
    game.pointer.x = e.clientX - r.left;
    game.pointer.y = e.clientY - r.top;
  }
  canvas.addEventListener("pointerdown", (e) => {
    ptr(e);
    game.pointer.down = true;
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add("grabbing");
    if (!game.running) { intro.classList.add("hidden"); game.running = true; }
  });
  canvas.addEventListener("pointermove", ptr);
  const release = () => { game.pointer.down = false; canvas.classList.remove("grabbing"); };
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);

  // ---------- 物理 ----------
  const PULL = 340;    // 波形拉力系数（× 振幅）
  const DRAG_K = 16;   // 指针橡皮筋刚度
  const DRAG_CAP = 3200; // 指针最大拉力（追红点需要一点时间）
  const DAMP = 2.4;    // 空气阻尼

  function waveAmp(w, dt, tNow) {
    w.surge *= Math.exp(-dt * 1.1);
    w.next -= dt;
    if (w.next <= 0) {
      // 随机涌动：某一边的波形突然增强（随游戏时间缓慢变难）
      const diff = Math.min(1, game.totalTime / 60);
      w.surge += rand(0.45, 0.85) + 0.55 * diff;
      w.next = rand(1.0, 2.6) + rand(0, 1.4) * (1 - diff);
    }
    const base = 0.42 + 0.30 * Math.sin(tNow * w.spd + w.ph);
    return Math.min(2.1, Math.max(0.08, base + w.surge));
  }

  function physics(dt, tNow) {
    const c = center(), R = safeR();
    let fx = 0, fy = 0;
    // 缓慢旋转的"焦虑气流"：让四股拉力不会完全抵消，红点总是被缓缓带往外侧
    const gustA = tNow * 0.13 + Math.sin(tNow * 0.07) * 2;
    const gustM = (0.22 + 0.2 * Math.sin(tNow * 0.11 + 1)) * PULL;
    fx += Math.cos(gustA) * gustM;
    fy += Math.sin(gustA) * gustM;
    for (const w of game.waves) {
      w.amp = waveAmp(w, dt, tNow);
      const a = anchorOf(w);
      const dx = a.x - game.pos.x, dy = a.y - game.pos.y;
      const d = Math.hypot(dx, dy) || 1;
      fx += dx / d * PULL * w.amp;
      fy += dy / d * PULL * w.amp;
    }
    if (game.pointer.down) {
      const dx = game.pointer.x - game.pos.x, dy = game.pointer.y - game.pos.y;
      let ax = dx * DRAG_K, ay = dy * DRAG_K;
      const m = Math.hypot(ax, ay);
      if (m > DRAG_CAP) { ax *= DRAG_CAP / m; ay *= DRAG_CAP / m; }
      fx += ax; fy += ay;
    }
    game.vel.x = (game.vel.x + fx * dt) * Math.exp(-DAMP * dt);
    game.vel.y = (game.vel.y + fy * dt) * Math.exp(-DAMP * dt);
    game.pos.x += game.vel.x * dt;
    game.pos.y += game.vel.y * dt;

    // 画布边界（轻微反弹）
    const M = 8;
    if (game.pos.x < M)     { game.pos.x = M;     game.vel.x *= -0.4; }
    if (game.pos.x > W - M) { game.pos.x = W - M; game.vel.x *= -0.4; }
    if (game.pos.y < M)     { game.pos.y = M;     game.vel.y *= -0.4; }
    if (game.pos.y > H - M) { game.pos.y = H - M; game.vel.y *= -0.4; }

    // 状态判定
    const dist = Math.hypot(game.pos.x - c.x, game.pos.y - c.y);
    const inside = dist <= R;
    const stressTgt = inside ? 0 : 1;
    game.stress += (stressTgt - game.stress) * (1 - Math.exp(-6 * dt));

    game.totalTime += dt;
    if (inside) {
      game.insideTime += dt; game.streak += dt;
      // 最佳纪录实时跟随当前连续平静时长
      if (game.streak > game.best) {
        game.best = game.streak;
        if (tNow - (game._bestSaved || 0) > 2) {
          game._bestSaved = tNow;
          localStorage.setItem("anxiety_best", game.best.toFixed(1));
        }
      }
    } else {
      if (game.streak > 0) localStorage.setItem("anxiety_best", game.best.toFixed(1));
      game.streak = 0;
    }
    // 出圈瞬间：震屏 + 红闪
    if (game._wasInside && !inside) { game.shake = 1; game.flash = 1; }
    game._wasInside = inside;
    game.shake *= Math.exp(-4 * dt);
    game.flash *= Math.exp(-2.5 * dt);

    // 螺旋随偏移加速 + 抖动
    const dev = clamp(dist / R, 0, 2);
    for (const s of game.spirals) {
      s.rot += (0.4 + 3.2 * dev * dev + 4.5 * game.stress) * s.dir * s.spd * dt;
      s.jit = (Math.sin(tNow * 17 + s.ph * 9) + Math.sin(tNow * 29 + s.ph * 5)) * 0.5
              * (0.04 + 0.22 * dev + 0.3 * game.stress);
    }
    game.pointer.near = Math.hypot(game.pointer.x - game.pos.x, game.pointer.y - game.pos.y) < 90;
  }

  // ---------- 绘制 ----------
  function drawWave(w, tNow, colW, colD, st) {
    const a = anchorOf(w);
    const amp = w.amp || 0.3;
    const horiz = (w.side === "top" || w.side === "bottom");
    const L = (horiz ? W : H) * 0.5;
    ctx.beginPath();
    for (let u = 0; u <= 1.0001; u += 1 / 110) {
      const env = Math.sin(u * Math.PI);
      const off = Math.sin(u * L * w.freq + tNow * w.spd + w.ph) * amp * 13 * env;
      const x = horiz ? a.x - L / 2 + u * L : a.x + off;
      const y = horiz ? a.y + off : a.y - L / 2 + u * L;
      u === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = colW;
    ctx.globalAlpha = 0.45 + 0.35 * clamp(amp, 0, 1) + 0.2 * st;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.globalAlpha = 1;

    // 锚点小节点
    ctx.beginPath();
    ctx.arc(a.x, a.y, 3.5, 0, 6.2832);
    ctx.fillStyle = colW;
    ctx.fill();
  }

  function drawDashLine(w, colD, st) {
    const a = anchorOf(w);
    const amp = w.amp || 0.3;
    ctx.setLineDash([6, 7]);
    ctx.beginPath();
    ctx.moveTo(game.pos.x, game.pos.y);
    ctx.lineTo(a.x, a.y);
    ctx.strokeStyle = colD;
    ctx.globalAlpha = 0.12 + 0.45 * clamp(amp / 1.5, 0, 1) + 0.25 * st;
    ctx.lineWidth = 1 + st * 0.8;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  function drawSpiral(s, R, colS, st) {
    const T = s.turns * 6.2832;
    const rMax = R * s.r;
    ctx.beginPath();
    const N = 90;
    for (let k = 0; k <= N; k++) {
      const t = (k / N) * T;
      const r = 5 + (rMax - 5) * (k / N);
      const a = t * s.dir + s.rot + s.jit * Math.sin(k * 0.6);
      const x = game.pos.x + Math.cos(a) * r;
      const y = game.pos.y + Math.sin(a) * r * 0.96;
      k === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = colS;
    ctx.globalAlpha = 0.38 + 0.25 * st;
    ctx.lineWidth = 1.6;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function draw(tNow) {
    const st = game.stress;
    const c = center(), R = safeR();
    const colBg = mix(C.bg[0], C.bg[1], st);
    const colCi = mix(C.circle[0], C.circle[1], st);
    const colW  = mix(C.wave[0], C.wave[1], st);
    const colD  = mix(C.dash[0], C.dash[1], st);
    const colS  = mix(C.spiral[0], C.spiral[1], st);
    const colDot= mix(C.dot[0], C.dot[1], st);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // 震屏
    if (game.shake > 0.01) {
      ctx.translate((Math.random() - 0.5) * game.shake * 12, (Math.random() - 0.5) * game.shake * 12);
    }
    ctx.fillStyle = colBg;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // 焦虑红晕
    if (st > 0.02) {
      const g = ctx.createRadialGradient(c.x, c.y, R * 0.5, c.x, c.y, Math.max(W, H) * 0.75);
      g.addColorStop(0, "rgba(224,72,62,0)");
      g.addColorStop(1, `rgba(224,72,62,${0.22 * st})`);
      ctx.fillStyle = g;
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }

    // 安全圈（平静时轻微呼吸填充）
    ctx.beginPath();
    ctx.arc(c.x, c.y, R, 0, 6.2832);
    const breath = 0.025 + 0.012 * Math.sin(tNow * 1.6);
    ctx.fillStyle = `rgba(67,83,217,${(1 - st) * breath})`;
    ctx.fill();
    ctx.strokeStyle = colCi;
    ctx.lineWidth = 2 + st * 1.2 + game.flash * 4;
    if (st > 0.5) ctx.setLineDash([10, 6]);
    ctx.stroke();
    ctx.setLineDash([]);

    // 连续平静进度弧（30 秒满一圈）
    const frac = clamp(game.streak / 30, 0, 1);
    if (frac > 0.002) {
      ctx.beginPath();
      ctx.arc(c.x, c.y, R + 12, -Math.PI / 2, -Math.PI / 2 + frac * 6.2832);
      ctx.strokeStyle = colW;
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.lineCap = "butt";
    }

    // 波形 → 虚线 → 螺旋 → 红点
    for (const w of game.waves) drawWave(w, tNow, colW, colD, st);
    for (const w of game.waves) drawDashLine(w, colD, st);
    for (const s of game.spirals) drawSpiral(s, R, colS, st);

    // 出圈红闪描边
    if (game.flash > 0.02) {
      ctx.beginPath();
      ctx.arc(c.x, c.y, R + 5, 0, 6.2832);
      ctx.strokeStyle = `rgba(224,72,62,${game.flash * 0.8})`;
      ctx.lineWidth = 5 * game.flash;
      ctx.stroke();
    }

    // 抓取提示光环
    if (!game.pointer.down && game.pointer.near && game.running) {
      ctx.beginPath();
      ctx.arc(game.pos.x, game.pos.y, 14 + 2 * Math.sin(tNow * 6), 0, 6.2832);
      ctx.strokeStyle = colDot;
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // 红点（焦虑时脉动）
    const pr = 7 + (game.pointer.down ? 1 : 0) + st * 1.5 * (0.5 + 0.5 * Math.sin(tNow * 9));
    ctx.beginPath();
    ctx.arc(game.pos.x, game.pos.y, pr, 0, 6.2832);
    ctx.fillStyle = colDot;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(game.pos.x, game.pos.y, pr, 0, 6.2832);
    ctx.strokeStyle = "rgba(255,255,255,0.85)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // ---------- HUD ----------
  const elMood = document.getElementById("stMood");
  const elStreak = document.getElementById("stStreak");
  const elBest = document.getElementById("stBest");
  const elRate = document.getElementById("stRate");
  let hudT = 0;
  function hud(dt) {
    hudT -= dt;
    if (hudT > 0) return;
    hudT = 0.15;
    const anxious = game.stress > 0.5;
    elMood.textContent = anxious ? "焦虑" : "平静";
    elMood.className = anxious ? "anxious" : "calm";
    elStreak.textContent = game.streak.toFixed(1) + " s";
    elBest.textContent = game.best.toFixed(1) + " s";
    elRate.textContent = game.totalTime > 1
      ? Math.round(game.insideTime / game.totalTime * 100) + "%" : "--";
  }

  // ---------- 主循环 ----------
  let lastT = 0;
  function frame(tms) {
    requestAnimationFrame(frame);
    const t = tms / 1000;
    const dt = clamp(lastT ? t - lastT : 0.016, 0, 0.05);
    lastT = t;
    if (!W || !H) return;
    if (!game.running) {
      // 开场演出：波形轻摆，红点居中
      const c = center();
      game.pos.x = c.x; game.pos.y = c.y;
      for (const w of game.waves) w.amp = waveAmp(w, dt, t);
      draw(t);
      return;
    }
    physics(dt, t);
    draw(t);
    hud(dt);
  }

  initWaves();
  initSpirals();
  reset(true);
  requestAnimationFrame(frame);
})();
</script>
</body>
